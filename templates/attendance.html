<!DOCTYPE html>
<html>

<head>
    <title>Attendance Records</title>
</head>

<body>

<h2>Attendance Records</h2>

<table border="1" cellpadding="10">

    <tr>
        <th>ID</th>
        <th>Roll No</th>
        <th>Name</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
    </tr>

    {% for record in records %}

    <tr>
        <td>{{ record.id }}</td>
        <td>{{ record.roll_no }}</td>
        <td>{{ record.name }}</td>
        <td>{{ record.attendance_date }}</td>
        <td>{{ record.attendance_time }}</td>
        <td>{{ record.status }}</td>
    </tr>

    {% endfor %}

</table>

</body>

</html>
