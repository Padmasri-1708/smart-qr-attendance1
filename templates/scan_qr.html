<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart QR Attendance</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding-top: 50px;
            margin: 0;
        }

        .box {
            background: white;
            width: 400px;
            max-width: 85%;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            margin-bottom: 20px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .location {
            color: #555;
            margin-top: 15px;
            line-height: 1.6;
        }

        .device {
            color: #777;
            font-size: 12px;
            margin-top: 15px;
            word-break: break-all;
            line-height: 1.5;
        }

        .logout {
            display: inline-block;
            margin-top: 15px;
        }

    </style>

</head>


<body>

<div class="box">

    <h2>Smart QR Attendance</h2>

    <p>
        Student:
        <b>{{ student_name }}</b>
    </p>

    <p>
        📍 Please enable your location
    </p>

    <button
        id="attendanceButton"
        onclick="markAttendance()">

        📍 Verify Location & Mark Attendance

    </button>

    <div id="result"></div>

    <div
        class="location"
        id="location">
    </div>

    <div
        class="device"
        id="deviceInfo">
    </div>

    <br>

    <a
        class="logout"
        href="/logout">

        Logout

    </a>

</div>


<script>

/* =====================================================
   DEVICE ID
   ===================================================== */

function getDeviceId() {

    let deviceId =
        localStorage.getItem(
            "smart_qr_device_id"
        );


    /*
       Existing Device ID
       ------------------
       If this browser already has
       a Device ID, use the same ID.
    */

    if (deviceId) {

        return deviceId;

    }


    /*
       Create new Device ID
    */

    if (
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
    ) {

        deviceId =
            "DEVICE-" +
            crypto.randomUUID();

    }

    else {

        /*
           Fallback Device ID
        */

        deviceId =
            "DEVICE-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2, 12);

    }


    /*
       Save Device ID
    */

    localStorage.setItem(
        "smart_qr_device_id",
        deviceId
    );


    return deviceId;
}


/* =====================================================
   DEVICE NAME
   ===================================================== */

function getDeviceName() {

    const ua =
        navigator.userAgent;


    /*
       Android
    */

    if (/Android/i.test(ua)) {

        /*
           Try to extract Android device name.
        */

        const match =
            ua.match(
                /Android[^;]*;\s*(?:[^;]+;\s*)?([^;)]+?)(?:\s+Build\/[^;)]+)?[;)]/i
            );


        if (
            match &&
            match[1]
        ) {

            let name =
                match[1].trim();


            /*
               Remove common unwanted text
            */

            name =
                name.replace(
                    /^wv$/i,
                    ""
                ).trim();


            if (name) {

                return name;

            }

        }


        return "Android Device";

    }


    /*
       iPhone
    */

    if (/iPhone/i.test(ua)) {

        return "iPhone";

    }


    /*
       iPad
    */

    if (/iPad/i.test(ua)) {

        return "iPad";

    }


    /*
       Windows
    */

    if (/Windows/i.test(ua)) {

        return "Windows Device";

    }


    /*
       Mac
    */

    if (/Macintosh/i.test(ua)) {

        return "Mac Device";

    }


    /*
       Linux
    */

    if (/Linux/i.test(ua)) {

        return "Linux Device";

    }


    return "Unknown Device";
}


/* =====================================================
   MARK ATTENDANCE
   ===================================================== */

function markAttendance() {

    const result =
        document.getElementById(
            "result"
        );


    const locationText =
        document.getElementById(
            "location"
        );


    const button =
        document.getElementById(
            "attendanceButton"
        );


    const deviceInfo =
        document.getElementById(
            "deviceInfo"
        );


    /*
       Initial message
    */

    result.innerHTML =
        "📍 Getting your location...";

    result.className = "";


    locationText.innerHTML =
        "";


    /*
       Disable button
    */

    button.disabled = true;


    /* =================================================
       CHECK GPS SUPPORT
       ================================================= */

    if (!navigator.geolocation) {

        result.innerHTML =
            "❌ GPS is not supported by this browser.";

        result.className =
            "error";

        button.disabled = false;

        return;
    }


    /* =================================================
       GET DEVICE INFORMATION
       ================================================= */

    let deviceId;

    let deviceName;


    try {

        deviceId =
            getDeviceId();

        deviceName =
            getDeviceName();

    }

    catch (error) {

        console.error(
            "Device Error:",
            error
        );


        result.innerHTML =
            "❌ Unable to create device information.";

        result.className =
            "error";

        button.disabled = false;

        return;
    }


    /* =================================================
       SHOW DEVICE INFORMATION
       ================================================= */

    deviceInfo.innerHTML =
        "Device Name: " +
        deviceName +
        "<br>" +
        "Device ID: " +
        deviceId;


    /* =================================================
       GET CURRENT LOCATION
       ================================================= */

    navigator.geolocation.getCurrentPosition(

        function(position) {


            /* =========================================
               LATITUDE
               ========================================= */

            const latitude =
                position.coords.latitude;


            /* =========================================
               LONGITUDE
               ========================================= */

            const longitude =
                position.coords.longitude;


            /* =========================================
               DISPLAY LOCATION
               ========================================= */

            locationText.innerHTML =
                "Latitude: " +
                latitude.toFixed(6) +
                "<br>" +
                "Longitude: " +
                longitude.toFixed(6);


            result.innerHTML =
                "⏳ Checking college location and device...";


            /* =========================================
               SEND DATA TO FLASK
               ========================================= */

            fetch(
                "/mark_attendance",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        latitude:
                            latitude,

                        longitude:
                            longitude,

                        device_id:
                            deviceId,

                        device_name:
                            deviceName

                    })

                }
            )


            /* =========================================
               SERVER RESPONSE
               ========================================= */

            .then(function(response) {

                return response.json();

            })


            /* =========================================
               PROCESS RESPONSE
               ========================================= */

            .then(function(data) {

                console.log(
                    "Server Response:",
                    data
                );


                /* =====================================
                   SUCCESS
                   ===================================== */

                if (data.success) {

                    result.innerHTML =
                        "✅ " +
                        data.message;

                    result.className =
                        "success";


                    locationText.innerHTML +=
                        "<br><br>" +
                        "Distance from College: " +
                        data.distance +
                        " meters";


                    /*
                       Show saved device name
                    */

                    if (data.device_name) {

                        deviceInfo.innerHTML =
                            "Device Name: " +
                            data.device_name +
                            "<br>" +
                            "Device ID: " +
                            deviceId;

                    }


                    /*
                       Disable after successful
                       attendance.
                    */

                    button.disabled = true;

                }


                /* =====================================
                   ERROR
                   ===================================== */

                else {

                    result.innerHTML =
                        "❌ " +
                        (
                            data.message ||
                            "Attendance failed."
                        );

                    result.className =
                        "error";


                    /* =================================
                       SHOW DISTANCE
                       ================================= */

                    if (
                        data.distance !== undefined
                    ) {

                        locationText.innerHTML +=
                            "<br><br>" +
                            "Distance from College: " +
                            data.distance +
                            " meters";

                    }


                    /*
                       Allow retry
                    */

                    button.disabled = false;

                }

            })


            /* =========================================
               FETCH ERROR
               ========================================= */

            .catch(function(error) {

                console.error(
                    "Fetch Error:",
                    error
                );


                result.innerHTML =
                    "❌ Unable to connect to server.";

                result.className =
                    "error";


                button.disabled = false;

            });

        },


        /* =============================================
           LOCATION ERROR
           ============================================= */

        function(error) {

            if (error.code === 1) {

                result.innerHTML =
                    "❌ Location permission denied.";

            }

            else if (error.code === 2) {

                result.innerHTML =
                    "❌ Location unavailable.";

            }

            else if (error.code === 3) {

                result.innerHTML =
                    "❌ Location request timed out.";

            }

            else {

                result.innerHTML =
                    "❌ Unable to get location.";

            }


            result.className =
                "error";


            button.disabled = false;

        },


        /* =============================================
           GPS OPTIONS
           ============================================= */

        {

            enableHighAccuracy: true,

            timeout: 60000,

            maximumAge: 30000

        }

    );

}

</script>

</body>

</html>
