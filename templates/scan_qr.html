    
<!DOCTYPE html>
<html>

<head>

    <title>Smart QR Attendance</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
            padding-top: 50px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ccc;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .location {
            color: #555;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Smart QR Attendance</h2>

    <p>
        Student:
        <b>{{ student_name }}</b>
    </p>

    <p>
        📍 Please enable your location
    </p>

    <button onclick="markAttendance()">
        📍 Verify Location & Mark Attendance
    </button>

    <div id="result"></div>

    <div class="location" id="location"></div>

    <br>

    <a href="/logout">
        Logout
    </a>

</div>


<script>

function markAttendance() {

    const result = document.getElementById("result");
    const locationText = document.getElementById("location");

    result.innerHTML = "📍 Getting your location...";
    result.className = "";

    if (!navigator.geolocation) {

        result.innerHTML = "❌ GPS is not supported by this browser.";
        result.className = "error";

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            locationText.innerHTML =
                "Latitude: " + latitude.toFixed(6) +
                "<br>" +
                "Longitude: " + longitude.toFixed(6);


            result.innerHTML =
                "⏳ Checking college location...";


            fetch("/mark_attendance", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    latitude: latitude,
                    longitude: longitude

                })

            })

            .then(response => response.json())

            .then(data => {

                if (data.success) {

                    result.innerHTML =
                        "✅ " + data.message;

                    result.className = "success";

                    locationText.innerHTML +=
                        "<br><br>" +
                        "Distance from College: " +
                        data.distance +
                        " meters";

                }

                else {

                    result.innerHTML =
                        "❌ " + data.message;

                    result.className = "error";

                    if (data.distance) {

                        locationText.innerHTML +=
                            "<br><br>" +
                            "Distance from College: " +
                            data.distance +
                            " meters";

                    }

                }

            })

            .catch(error => {

                console.error(error);

                result.innerHTML =
                    "❌ Unable to connect to server.";

                result.className = "error";

            });

        },


        function(error) {

            if (error.code === 1) {

                result.innerHTML =
                    "❌ Location permission denied.";

            }

            else if (error.code === 2) {

                result.innerHTML =
                    "❌ Location unavailable.";

            }

            else if (error.code === 3) {

                result.innerHTML =
                    "❌ Location request timed out.";

            }

            else {

                result.innerHTML =
                    "❌ Unable to get location.";

            }

            result.className = "error";

        },

        {
            enableHighAccuracy:false,
            timeout:60000,
            maximumAge:30000
        }

    );

}

</script>

</body>

</html>
