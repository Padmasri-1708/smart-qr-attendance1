<!DOCTYPE html>
<html>

<head>

    <title>Smart QR Attendance</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding-top: 50px;
        }

        .box {
            background: white;
            width: 400px;
            max-width: 90%;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ccc;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .location {
            color: #555;
            margin-top: 15px;
        }

        .device {
            color: #777;
            font-size: 12px;
            margin-top: 15px;
            word-break: break-all;
        }

    </style>

</head>


<body>

<div class="box">

    <h2>Smart QR Attendance</h2>

    <p>
        Student:
        <b>{{ student_name }}</b>
    </p>

    <p>
        📍 Please enable your location
    </p>

    <button
        id="attendanceButton"
        onclick="markAttendance()">

        📍 Verify Location & Mark Attendance

    </button>

    <div id="result"></div>

    <div
        class="location"
        id="location">
    </div>

    <div
        class="device"
        id="deviceInfo">
    </div>

    <br>

    <a href="/logout">
        Logout
    </a>

</div>


<script>

/* =====================================================
   DEVICE ID
   ===================================================== */

function getDeviceId() {

    let deviceId =
        localStorage.getItem("smart_qr_device_id");


    /*
       If device ID already exists,
       use the same ID.
    */

    if (deviceId) {
        return deviceId;
    }


    /*
       Create a new device ID.
    */

    if (
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
    ) {

        deviceId =
            "DEVICE-" +
            crypto.randomUUID();

    }

    else {

        /*
           Fallback method
           if randomUUID is unavailable.
        */

        deviceId =
            "DEVICE-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2, 12);

    }


    /*
       Save device ID in browser.
    */

    localStorage.setItem(
        "smart_qr_device_id",
        deviceId
    );


    return deviceId;
}


/* =====================================================
   MARK ATTENDANCE
   ===================================================== */

function markAttendance() {

    const result =
        document.getElementById("result");

    const locationText =
        document.getElementById("location");

    const button =
        document.getElementById("attendanceButton");


    result.innerHTML =
        "📍 Getting your location...";

    result.className = "";


    locationText.innerHTML = "";


    /*
       Disable button while checking.
    */

    button.disabled = true;


    /*
       Check GPS support.
    */

    if (!navigator.geolocation) {

        result.innerHTML =
            "❌ GPS is not supported by this browser.";

        result.className =
            "error";

        button.disabled = false;

        return;
    }


    /*
       Get browser/device ID.
    */

    let deviceId;

    try {

        deviceId = getDeviceId();

    }

    catch (error) {

        console.error(
            "Device ID Error:",
            error
        );

        result.innerHTML =
            "❌ Unable to create Device ID.";

        result.className =
            "error";

        button.disabled = false;

        return;
    }


    /*
       Show device ID for testing.
       You can remove this later.
    */

    document.getElementById(
        "deviceInfo"
    ).innerHTML =
        "Device ID: " + deviceId;


    /*
       Get current location.
    */

    navigator.geolocation.getCurrentPosition(

        function(position) {


            /* =========================================
               GET LATITUDE AND LONGITUDE
               ========================================= */

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            /* =========================================
               DISPLAY LOCATION
               ========================================= */

            locationText.innerHTML =
                "Latitude: " +
                latitude.toFixed(6) +
                "<br>" +
                "Longitude: " +
                longitude.toFixed(6);


            result.innerHTML =
                "⏳ Checking college location and device...";


            /* =========================================
               SEND DATA TO FLASK
               ========================================= */

            fetch(
                "/mark_attendance",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        latitude:
                            latitude,

                        longitude:
                            longitude,

                        device_id:
                            deviceId

                    })

                }
            )


            /* =========================================
               GET SERVER RESPONSE
               ========================================= */

            .then(function(response) {

                return response.json();

            })


            /* =========================================
               PROCESS RESPONSE
               ========================================= */

            .then(function(data) {

                console.log(
                    "Server Response:",
                    data
                );


                if (data.success) {


                    /*
                       Attendance successful.
                    */

                    result.innerHTML =
                        "✅ " +
                        data.message;

                    result.className =
                        "success";


                    locationText.innerHTML +=
                        "<br><br>" +
                        "Distance from College: " +
                        data.distance +
                        " meters";


                    /*
                       Keep button disabled after success.
                    */

                    button.disabled = true;

                }


                else {


                    /*
                       Attendance failed.
                    */

                    result.innerHTML =
                        "❌ " +
                        data.message;

                    result.className =
                        "error";


                    /*
                       Show distance if server sends it.
                    */

                    if (
                        data.distance !== undefined
                    ) {

                        locationText.innerHTML +=
                            "<br><br>" +
                            "Distance from College: " +
                            data.distance +
                            " meters";

                    }


                    /*
                       Allow retry for errors.
                    */

                    button.disabled = false;

                }

            })


            /* =========================================
               SERVER CONNECTION ERROR
               ========================================= */

            .catch(function(error) {

                console.error(
                    "Fetch Error:",
                    error
                );


                result.innerHTML =
                    "❌ Unable to connect to server.";

                result.className =
                    "error";


                button.disabled = false;

            });

        },


        /* =============================================
           LOCATION ERROR
           ============================================= */

        function(error) {

            if (error.code === 1) {

                result.innerHTML =
                    "❌ Location permission denied.";

            }

            else if (error.code === 2) {

                result.innerHTML =
                    "❌ Location unavailable.";

            }

            else if (error.code === 3) {

                result.innerHTML =
                    "❌ Location request timed out.";

            }

            else {

                result.innerHTML =
                    "❌ Unable to get location.";

            }


            result.className =
                "error";


            button.disabled = false;

        },


        /* =============================================
           GPS OPTIONS
           ============================================= */

        {
            enableHighAccuracy: false,

            timeout: 60000,

            maximumAge: 30000
        }

    );

}

</script>

</body>

</html>
