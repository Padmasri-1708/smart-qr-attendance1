<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <h3>Attendance Management System</h3>

    <a href="/generate_qr" class="button">
        Generate QR Code
    </a>

    <a href="/register" class="button">
        Register Student
    </a>

    <a href="/attendance_report" class="button">
        View Attendance
    </a>

</div>

</body>
</html>
